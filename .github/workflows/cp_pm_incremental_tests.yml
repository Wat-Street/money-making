name: CP + PM Incremental Value Test

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Enable verbose output"
        required: false
        default: "false"

jobs:
  cp_pm_incremental_test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./projects/harv-extension
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scipy scikit-learn statsmodels yfinance

      - name: Run CP + PM incremental test
        working-directory: ./projects/harv-extension
        env:
          BOOTSTRAP_RESAMPLES: "300"
          WARMUP: "600"
          N_LAGS: "22"
        run: |
          python outputs/cp_pm_incremental_tests/scripts/run_cp_pm_incremental_tests.py

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp_pm_incremental_tests_outputs
          path: projects/harv-extension/outputs/cp_pm_incremental_tests/
          retention-days: 30
          if-no-files-found: warn

      - name: Display test summary
        if: always()
        working-directory: ./projects/harv-extension
        run: |
          if [ -f outputs/cp_pm_incremental_tests/SUCCESS.txt ]; then
            echo "=== Success Marker ==="
            cat outputs/cp_pm_incremental_tests/SUCCESS.txt
          fi
          if [ -f outputs/cp_pm_incremental_tests/README.md ]; then
            echo "=== Test Summary ==="
            head -120 outputs/cp_pm_incremental_tests/README.md
          fi
