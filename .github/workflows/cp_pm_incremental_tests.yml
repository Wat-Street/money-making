name: CP + PM Incremental Value Test

on:
  push:
    branches:
      - cp-pm-incremental-actions
    paths:
      - ".github/workflows/cp_pm_incremental_tests.yml"
      - "projects/harv-extension/outputs/cp_pm_incremental_tests/scripts/run_cp_pm_incremental_tests.py"
      - "projects/harv-extension/code/**"
      - "projects/harv-extension/run_results/current_intraday/predictions/**"
      - "projects/harv-extension/data/market_data/clean/**"
      - "projects/harv-extension/config/requirements.txt"
  workflow_dispatch:
    inputs:
      verbose:
        description: "Enable verbose output"
        required: false
        default: "false"

jobs:
  cp_pm_incremental_test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./projects/harv-extension
        run: |
          python -m pip install --upgrade pip
          if [ -f config/requirements.txt ]; then
            pip install -r config/requirements.txt
          else
            pip install pandas numpy matplotlib scipy scikit-learn statsmodels
          fi

      - name: Run CP + PM incremental test
        working-directory: ./projects/harv-extension
        run: |
          python outputs/cp_pm_incremental_tests/scripts/run_cp_pm_incremental_tests.py

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp_pm_incremental_tests_outputs
          path: projects/harv-extension/outputs/cp_pm_incremental_tests/
          retention-days: 30
          if-no-files-found: warn

      - name: Display test summary
        if: always()
        working-directory: ./projects/harv-extension
        run: |
          if [ -f outputs/cp_pm_incremental_tests/README.md ]; then
            echo "=== Test Summary ==="
            head -80 outputs/cp_pm_incremental_tests/README.md
          fi
